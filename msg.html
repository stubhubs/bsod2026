<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Clone</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="flex flex-col h-screen bg-[#f0f2f5] overflow-hidden font-sans text-gray-900">

    <!-- Top Navigation Bar -->
    <nav class="h-14 bg-white shadow-sm flex items-center justify-between px-4 z-10 relative">
        <!-- Left: Logo & Search -->
        <div class="flex items-center gap-2 w-1/4">
            <div
                class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-xl">
                f
            </div>
            <div class="relative flex-1 max-w-[240px] hidden md:block">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4 text-gray-500"></i>
                </div>
                <input type="text" placeholder="Search Facebook"
                    class="bg-[#f0f2f5] rounded-full w-full py-2 pl-9 pr-4 text-[15px] focus:outline-none placeholder-gray-500" />
            </div>
        </div>

        <!-- Center: Main Tabs -->
        <div class="flex items-center gap-1 justify-center flex-1 max-w-2xl">
            <div
                class="flex items-center justify-center w-32 h-12 rounded-lg cursor-pointer transition-colors relative text-blue-600">
                <i data-lucide="home" class="w-7 h-7"></i>
                <div class="absolute bottom-0 left-0 right-0 h-1 bg-blue-600 rounded-t-lg"></div>
            </div>
            <div
                class="flex items-center justify-center w-32 h-12 rounded-lg cursor-pointer transition-colors relative text-gray-500 hover:bg-gray-100">
                <i data-lucide="tv" class="w-7 h-7"></i>
            </div>
            <div
                class="flex items-center justify-center w-32 h-12 rounded-lg cursor-pointer transition-colors relative text-gray-500 hover:bg-gray-100">
                <i data-lucide="users" class="w-7 h-7"></i>
            </div>
            <div
                class="flex items-center justify-center w-32 h-12 rounded-lg cursor-pointer transition-colors relative text-gray-500 hover:bg-gray-100">
                <i data-lucide="store" class="w-7 h-7"></i>
            </div>
            <div
                class="flex items-center justify-center w-32 h-12 rounded-lg cursor-pointer transition-colors relative text-gray-500 hover:bg-gray-100">
                <i data-lucide="gamepad-2" class="w-7 h-7"></i>
            </div>
        </div>

        <!-- Right: User Menus -->
        <div class="flex items-center gap-2 justify-end w-1/4">
            <div
                class="relative w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center cursor-pointer transition-colors text-gray-800">
                <i data-lucide="grid" class="w-5 h-5"></i>
            </div>
            <div
                class="relative w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center cursor-pointer transition-colors text-gray-800">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <div
                    class="absolute -top-1 -right-1 bg-red-500 text-white text-[11px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white">
                    13
                </div>
            </div>
            <img src="https://i.pravatar.cc/150?u=current" alt="Current User"
                class="w-10 h-10 rounded-full border border-gray-200 cursor-pointer ml-1" />
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden">

        <!-- LEFT SIDEBAR: Chats List -->
        <aside class="w-[360px] bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
            <div class="p-4 pb-2 flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-bold">Chats</h1>
                    <div class="flex gap-2">
                        <button
                            class="w-9 h-9 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center transition-colors">
                            <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                        </button>
                        <button
                            class="w-9 h-9 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center transition-colors">
                            <i data-lucide="edit" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="search" class="w-4 h-4 text-gray-500"></i>
                    </div>
                    <input type="text" placeholder="Search Messenger"
                        class="bg-[#f0f2f5] rounded-full w-full py-2 pl-9 pr-4 text-[15px] focus:outline-none placeholder-gray-500" />
                </div>
                <div class="flex gap-2 text-sm font-semibold">
                    <span class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-full cursor-pointer">All</span>
                    <span class="px-3 py-1.5 hover:bg-gray-100 text-gray-600 rounded-full cursor-pointer">Unread</span>
                    <span class="px-3 py-1.5 hover:bg-gray-100 text-gray-600 rounded-full cursor-pointer">Groups</span>
                    <span
                        class="px-3 py-1.5 hover:bg-gray-100 text-gray-600 rounded-full cursor-pointer">Communities</span>
                </div>
            </div>

            <!-- Chats container (populated by JS) -->
            <div id="chat-list" class="flex-1 overflow-y-auto px-2 pb-4">
                <!-- JS will inject chat items here -->
            </div>
        </aside>

        <!-- MIDDLE COLUMN: Active Chat -->
        <main class="flex-1 flex flex-col bg-white min-w-0">
            <!-- Chat Header -->
            <header
                class="h-[60px] border-b border-gray-200 flex items-center justify-between px-4 shadow-sm z-10 flex-shrink-0">
                <div class="flex items-center gap-3 cursor-pointer p-1 rounded-md hover:bg-gray-100 transition-colors">
                    <img src="https://i.pravatar.cc/150?u=ahmed" alt="Contact" class="w-10 h-10 rounded-full" />
                    <div>
                        <h2 class="text-[17px] font-semibold text-gray-900">Ahmed Mahmoud HAmmad</h2>
                    </div>
                </div>
                <div class="flex items-center gap-4 text-[#8b5cf6]">
                    <i data-lucide="phone"
                        class="w-5 h-5 cursor-pointer hover:bg-gray-100 p-2 rounded-full box-content transition-colors"></i>
                    <i data-lucide="video"
                        class="w-6 h-6 cursor-pointer hover:bg-gray-100 p-2 rounded-full box-content transition-colors"></i>
                    <i data-lucide="info"
                        class="w-[22px] h-[22px] cursor-pointer hover:bg-gray-100 p-2 rounded-full box-content transition-colors"></i>
                </div>
            </header>

            <!-- Chat Messages Area -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-6">
                <div class="text-center mt-4 mb-2">
                    <img src="https://i.pravatar.cc/150?u=ahmed" alt="Contact"
                        class="w-16 h-16 rounded-full mx-auto mb-2" />
                    <h3 class="text-lg font-bold">Ahmed Mahmoud HAmmad</h3>
                </div>
                <!-- JS will inject call history items here -->
            </div>

            <!-- Chat Input Area -->
            <div class="p-3 bg-white flex items-center gap-2 border-t border-gray-100 flex-shrink-0">
                <div class="flex items-center gap-3 text-blue-600 px-2">
                    <i data-lucide="plus-circle" class="w-[22px] h-[22px] cursor-pointer"></i>
                    <i data-lucide="image" class="w-[22px] h-[22px] cursor-pointer"></i>
                    <i data-lucide="sticker" class="w-[22px] h-[22px] cursor-pointer"></i>
                    <div class="font-bold text-sm bg-blue-600 text-white rounded px-1 cursor-pointer">GIF</div>
                </div>

                <div class="flex-1 bg-[#f0f2f5] rounded-full flex items-center px-4 py-2 relative">
                    <input type="text" placeholder="Aa" class="bg-transparent w-full focus:outline-none text-[15px]" />
                    <div class="text-blue-600 cursor-pointer">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" class="text-blue-600">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.28 12.72a.75.75 0 01-1.06 1.06l-2.5-2.5a.75.75 0 01-.22-.53V8.5a.75.75 0 011.5 0v3.94l2.28 2.28z">
                            </path>
                        </svg>
                    </div>
                </div>

                <div class="text-blue-600 px-2 cursor-pointer">
                    <i data-lucide="thumbs-up" class="w-6 h-6 fill-current"></i>
                </div>
            </div>
        </main>

        <!-- RIGHT PANEL: Chat Info -->
        <aside
            class="w-[340px] bg-white border-l border-gray-200 flex flex-col flex-shrink-0 overflow-y-auto hidden lg:flex">
            <div class="flex flex-col items-center pt-6 pb-4">
                <img src="https://i.pravatar.cc/150?u=ahmed" alt="Contact Large"
                    class="w-20 h-20 rounded-full mb-3 shadow-sm" />
                <h2 class="text-lg font-bold text-gray-900">Ahmed Mahmoud HAmmad</h2>
            </div>

            <div class="flex justify-center gap-6 px-4 py-2 mb-4">
                <div class="flex flex-col items-center gap-1 cursor-pointer group">
                    <div
                        class="w-9 h-9 bg-gray-100 group-hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-800 transition-colors">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Profile</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer group">
                    <div
                        class="w-9 h-9 bg-gray-100 group-hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-800 transition-colors">
                        <i data-lucide="bell-off" class="w-5 h-5"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Mute</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer group">
                    <div
                        class="w-9 h-9 bg-gray-100 group-hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-800 transition-colors">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Search</span>
                </div>
            </div>

            <div class="flex flex-col px-2" id="accordion-container">
                <!-- Rendered by JS -->
            </div>
        </aside>

    </div>

    <script>
        // --- Mock Data ---
        const activeContactAvatar = "https://i.pravatar.cc/150?u=ahmed";

        const chatList = [
            { id: 1, name: "Hesham Qarawi", avatar: "https://i.pravatar.cc/150?u=hesham", lastMsg: "https://serji.com/aR/?n=Soma-So...", time: "17w", isUnread: false },
            { id: 2, name: "Omaran Koji", avatar: "https://i.pravatar.cc/150?u=omaran", lastMsg: "You missed a call from Omaran.", time: "19w", isUnread: false },
            { id: 3, name: "Wafaa Qarawi", avatar: "https://i.pravatar.cc/150?u=wafaa", lastMsg: "You missed a call from Wafaa.", time: "1y", isUnread: false },
            { id: 4, name: "Ahmed Mahmoud HAmmad", avatar: activeContactAvatar, lastMsg: "You missed a call from Ahmed.", time: "1y", isUnread: false, isActive: true },
            { id: 5, name: "عيلة 7 نجوم 🥰🥰😂", avatar: "https://i.pravatar.cc/150?u=family", lastMsg: "Message unavailable", time: "2y", isUnread: true, hasBlueDot: true },
            { id: 6, name: "Hani Karawi", avatar: "https://i.pravatar.cc/150?u=hani", lastMsg: "Missed call", time: "3y", isUnread: true, isMissedCall: true, hasBlueDot: true },
            { id: 7, name: "Refaat Alfar", avatar: "https://i.pravatar.cc/150?u=refaat", lastMsg: "Missed call", time: "3y", isUnread: true, isMissedCall: true, hasBlueDot: true },
            { id: 8, name: "اشرف الفقي", avatar: "https://i.pravatar.cc/150?u=ashraf", lastMsg: "https://m.facebook.com/groups...", time: "3y", isUnread: true, hasBlueDot: true },
            { id: 9, name: "سمير عسال", avatar: "https://i.pravatar.cc/150?u=samir", lastMsg: "Missed call", time: "4y", isUnread: true, isMissedCall: true, hasBlueDot: true },
        ];

        const callHistory = [
            { id: 1, date: "5/3/21, 10:06 AM", time: "10:06 AM" },
            { id: 2, date: "5/3/21, 2:39 PM", time: "2:39 PM" },
            { id: 3, date: "3/25/24, 2:51 PM", time: "2:51 PM" },
            { id: 4, date: "4/6/24, 1:39 AM", time: "1:39 AM" },
            { id: 5, date: "2/15/25, 1:56 AM", time: "1:56 AM" },
            { id: 6, date: "2/15/25, 3:57 AM", time: "3:57 AM" },
        ];

        const accordionTitles = [
            "Chat info",
            "Customize chat",
            "Media, files and links",
            "Privacy & support"
        ];

        // --- DOM Injection Logic ---

        // Inject Chats
        const chatListContainer = document.getElementById('chat-list');
        chatListContainer.innerHTML = chatList.map(chat => `
      <div class="flex items-center gap-3 p-2 rounded-lg cursor-pointer transition-colors relative ${chat.isActive ? 'bg-[#ebf5ff]' : 'hover:bg-gray-100'}">
        <div class="relative">
          <img src="${chat.avatar}" alt="${chat.name}" class="w-14 h-14 rounded-full object-cover" />
          ${chat.isUnread ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>' : ''}
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-[15px] truncate ${chat.isUnread ? 'font-bold text-gray-900' : 'font-medium text-gray-800'}">
            ${chat.name}
          </h3>
          <div class="flex items-center text-[13px] text-gray-500 gap-1">
            <span class="truncate ${chat.isMissedCall ? 'text-red-500 font-medium' : ''}">
              ${chat.lastMsg}
            </span>
            <span class="flex-shrink-0">· ${chat.time}</span>
          </div>
        </div>
        ${chat.hasBlueDot ? '<div class="w-3 h-3 bg-blue-600 rounded-full flex-shrink-0 mr-2"></div>' : ''}
      </div>
    `).join('');

        // Inject Call History
        const chatMessagesContainer = document.getElementById('chat-messages');
        chatMessagesContainer.innerHTML += callHistory.map(call => `
      <div class="flex flex-col">
        <div class="text-center text-xs font-semibold text-gray-500 mb-6 mt-4">
          ${call.date}
        </div>
        <div class="flex items-end gap-2 group">
          <img src="${activeContactAvatar}" alt="Contact" class="w-7 h-7 rounded-full mb-1" />
          <div class="bg-[#f0f2f5] rounded-2xl rounded-bl-sm p-3 px-4 max-w-sm flex items-center gap-3">
            <div class="w-10 h-10 bg-red-50 rounded-full flex items-center justify-center flex-shrink-0">
              <div class="w-8 h-8 bg-red-500 rounded-full flex items-center justify-center text-white">
                <i data-lucide="phone-missed" class="w-4 h-4" stroke-width="2.5"></i>
              </div>
            </div>
            <div>
              <p class="text-[15px] font-medium text-gray-900">Missed audio call</p>
              <p class="text-[13px] text-gray-500">${call.time}</p>
            </div>
          </div>
          <div class="opacity-0 group-hover:opacity-100 transition-opacity flex gap-2 ml-2 self-center text-gray-400">
             <i data-lucide="more-horizontal" class="w-[18px] h-[18px] cursor-pointer hover:text-gray-600"></i>
          </div>
        </div>
      </div>
    `).join('');

        // Inject Accordions
        const accordionContainer = document.getElementById('accordion-container');
        accordionContainer.innerHTML = accordionTitles.map(title => `
      <div class="flex items-center justify-between p-2 rounded-lg hover:bg-gray-100 cursor-pointer transition-colors">
        <span class="text-[15px] font-semibold text-gray-900">${title}</span>
        <i data-lucide="chevron-down" class="w-5 h-5 text-gray-500"></i>
      </div>
    `).join('');

        // Initialize Lucide Icons (Call this AFTER injecting HTML elements that contain data-lucide)
        lucide.createIcons();
    </script>
</body>

</html>
